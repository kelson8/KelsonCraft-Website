# Modified from my Nginx containers

server {
    # listen 80;
    # Changed to higher port for non-root user.
    listen 8081;
    # https://serverfault.com/questions/1030551/force-nginx-to-use-browser-port-on-redirect-instead-of-docker-mapping-port
    server_name _;

    # https://serverfault.com/questions/227742/prevent-port-change-on-redirect-in-nginx
    # This fixes the port being redirected from 8058 to 80 locally!
    # I was not expecting this to work.
    absolute_redirect off;
    root /var/www/html;

    # If using Traefik from another host, set the IP address here, otherwise use the Cloudflare list of IPs.
#     set_real_ip_from 192.168.1.1/32;

    # This adds the Cloudflare IPs and the CF-Connecting-IP header.
    # This is required for proper IP logging behind Cloudflare.
    include /etc/nginx/cloudflare.conf;

    # https://thelinuxcode.com/nginx-include/

    #-------
    # Compression
    #-------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json
                   application/javascript application/xml+rss
                   application/atom+xml image/svg+xml;

    #-------
    # Cache some files
    # https://dev.to/soliloquizin/cache-control-header-cache-busting-dh0
    #-------
    location ~* \.(?:|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control public;
        access_log off;
    }

    # https://www.getpagespeed.com/server-setup/nginx/nginx-browser-caching
    # Make images not be cached as long.
    location ~* .(png|jpg|jpeg|gif|webp|avif|svg)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate" always;
        access_log off;
    }

    # Only cache css and js files for up to a week.
    location ~* \.(?:css|js) {
        expires 1w;
        add_header Cache-Control public;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    #-------
    # Error pages
    #-------
    error_page 404 /404.html;
    location = /404.html {
            root /var/www/html;
            internal;
    }

    error_page 500 /500.html;
    location = /500.html {
            root /var/www/html;
            internal;
    }

    # https://serverfault.com/questions/162429/how-do-i-add-access-control-allow-origin-in-nginx
    # For videos/audio CORS
    location ~* \.(mp4|webm|mp3|m4a|ogg)$ {
        add_header Access-Control-Allow-Origin *;
    }

    # Added for the robots.txt file generated with Astro.
    location ^~ /robots.txt {
        alias /var/www/html/robots.txt;
    }

    # New for /download endpoint, I forgot to enable this from the Flask website.
    location /download/ {
        # https://bobcares.com/blog/nginx-autoindex_format/
        # This can be toggled on in the future, I may make a downloads page in Astro.
        # autoindex on;
        # autoindex_exact_size off;
        # autoindex_localtime on;
        alias /var/www/html/download/;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

}
