# Modified from my Nginx containers

server {
    listen 80;
    # https://serverfault.com/questions/1030551/force-nginx-to-use-browser-port-on-redirect-instead-of-docker-mapping-port
    server_name _;

    # https://serverfault.com/questions/227742/prevent-port-change-on-redirect-in-nginx
    # This fixes the port being redirected from 8058 to 80 locally!
    # I was not expecting this to work.
    absolute_redirect off;
    root /var/www/html;

    # TODO Is this needed? This could possibly be used for Cloudflare later.
    # real_ip_header X-Forwarded-For;
    # set_real_ip_from 172.0.0.0/8;

    # https://thelinuxcode.com/nginx-include/

    #-------
    # Compression
    #-------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml application/json
                   application/javascript application/xml+rss
                   application/atom+xml image/svg+xml;

    #-------
    # Cache some files
    #-------
    location ~* \.(?:css|js|svg|gif|png|jpg|jpeg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    #-------
    # Error pages
    #-------
    error_page 404 /404.html;
    location = /404.html {
            root /var/www/html;
            internal;
    }

    error_page 500 /500.html;
    location = /500.html {
            root /var/www/html;
            internal;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

}
